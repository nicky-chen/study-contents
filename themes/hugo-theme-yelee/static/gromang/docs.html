<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句芒智元 · 使用者文档</title>
<meta name="description" content="句芒智元（Gromang）使用者文档：快速入门、产品功能介绍与各功能深度指南——智能哨兵、智能化测试、记忆、技能、计划任务、通信渠道、远程访问等。">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* 与 index.html 同一套设计基元 */
  :root {
    --page-bg: #0e0e0e;
    --page-fg: #fafafa;
    --page-muted: #a1a1aa;
    --card: rgba(255, 255, 255, 0.03);
    --card-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.2);
    --code-bg: rgba(255, 255, 255, 0.06);
    --accent: #60a5fa;
    --link: #93c5fd;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --page-bg: #ffffff;
      --page-fg: #0a0a0a;
      --page-muted: #71717a;
      --card: rgba(0, 0, 0, 0.02);
      --card-hover: rgba(0, 0, 0, 0.04);
      --border: rgba(0, 0, 0, 0.1);
      --border-strong: rgba(0, 0, 0, 0.22);
      --code-bg: rgba(0, 0, 0, 0.05);
      --accent: #2563eb;
      --link: #2563eb;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--page-fg);
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .backdrop { pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: -1; }
  .backdrop .radial {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(59, 130, 246, 0.22), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(168, 85, 247, 0.18), transparent 55%);
  }
  .backdrop .grid {
    position: absolute; inset: 0; opacity: 0.18;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.18) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 75%);
    mask-image: radial-gradient(ellipse at center, black 35%, transparent 75%);
  }
  .backdrop .glow-top {
    position: absolute; top: -128px; left: 50%; transform: translateX(-50%);
    height: 288px; width: 576px; border-radius: 9999px;
    background: rgba(59, 130, 246, 0.2); filter: blur(64px);
  }

  /* 顶部品牌与右上角导航（与 index.html 对称） */
  .brand {
    position: fixed; top: 20px; left: 24px; z-index: 10;
    display: inline-flex; align-items: center; gap: 8px; height: 34px;
  }
  .brand .diamond {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; font-size: 16px; line-height: 1;
    background: linear-gradient(135deg, #00e5ff, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: brand-pulse 3s ease-in-out infinite;
  }
  @keyframes brand-pulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
    50% { opacity: 0.4; text-shadow: 0 0 4px rgba(139, 92, 246, 0.1); }
  }
  .brand .title {
    font-size: 19px; font-weight: 800; letter-spacing: -0.025em;
    background: linear-gradient(135deg, #00e5ff 0%, #06b6d4 40%, #a855f7 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .corner-nav {
    position: fixed; top: 20px; right: 24px; z-index: 10; height: 34px;
    display: inline-flex; align-items: center; gap: 18px;
  }
  .corner-link {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; color: var(--page-muted); opacity: 0.85;
    transition: opacity .15s ease, color .15s ease;
  }
  .corner-link:hover { opacity: 1; color: var(--page-fg); text-decoration: none; }
  .corner-link svg { width: 16px; height: 16px; }
  .gitee-corner svg { width: 22px; height: 22px; display: block; }

  /* 文档布局：侧栏 + 内容 */
  .docs-wrap {
    max-width: 1180px; margin: 0 auto; padding: 88px 24px 40px;
    display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 44px;
  }
  .docs-side {
    position: sticky; top: 88px; align-self: start;
    max-height: calc(100vh - 120px); overflow-y: auto; overscroll-behavior: contain;
    padding-right: 4px;
  }
  .docs-side::-webkit-scrollbar { width: 4px; }
  .docs-side::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .side-filter {
    width: 100%; margin-bottom: 14px; padding: 7px 12px;
    font: inherit; font-size: 13px; color: var(--page-fg);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    outline: none;
  }
  .side-filter:focus { border-color: var(--border-strong); }
  .side-group { margin-bottom: 22px; }
  .side-group-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; letter-spacing: .04em;
    color: var(--page-fg); opacity: .85;
    margin: 0 0 8px 12px;
  }
  .side-group-label::after {
    content: ""; flex: 1; height: 1px;
    background: var(--border);
  }
  .side-item {
    position: relative; display: block; padding: 7px 12px; border-radius: 8px;
    font-size: 14px; color: var(--page-muted); cursor: pointer;
    transition: color .12s ease, background .12s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-item:hover { color: var(--page-fg); background: var(--card); text-decoration: none; }
  .side-item.active {
    color: var(--page-fg); font-weight: 650; background: var(--card-hover);
  }
  .side-item.active::before {
    content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px;
    border-radius: 2px; background: linear-gradient(to bottom, #3b82f6, #06b6d4);
  }
  .side-empty { padding: 10px 12px; font-size: 13px; color: var(--page-muted); }

  .docs-content { min-width: 0; max-width: 820px; }

  /* 加载与错误态 */
  .doc-loading {
    padding: 80px 0; text-align: center; color: var(--page-muted); font-size: 14px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .doc-error {
    margin-top: 32px; padding: 28px; text-align: center;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
    color: var(--page-muted); font-size: 14px;
  }
  .doc-error a { color: var(--link); }

  /* markdown 排版 */
  .md-body h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 20px 0 18px; letter-spacing: -0.01em; }
  .md-body h2 {
    font-size: 20px; font-weight: 700; margin: 44px 0 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); scroll-margin-top: 84px;
  }
  .md-body h3 { font-size: 16.5px; font-weight: 650; margin: 28px 0 10px; scroll-margin-top: 84px; }
  .md-body h4 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; scroll-margin-top: 84px; }
  .md-body p { margin: 12px 0; }
  .md-body strong { font-weight: 650; }
  .md-body ul, .md-body ol { padding-left: 24px; margin: 12px 0; }
  .md-body li { margin: 5px 0; }
  .md-body blockquote {
    margin: 16px 0; padding: 10px 16px;
    border-left: 3px solid #3b82f6; border-radius: 0 8px 8px 0;
    background: var(--card);
  }
  .md-body blockquote p { margin: 6px 0; }
  .md-body hr { border: 0; border-top: 1px solid var(--border); margin: 34px 0; }
  .md-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 6px; color: var(--page-fg);
    word-break: break-all;
  }
  .md-body pre {
    margin: 14px 0; padding: 14px 16px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
  }
  .md-body pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.6; }
  .md-table { margin: 16px 0; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  .md-table table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .md-table th {
    background: var(--card); font-weight: 600; text-align: left;
    padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .md-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .md-table tr:last-child td { border-bottom: 0; }
  .md-table tr:hover td { background: var(--card); }

  .docs-footer {
    margin: 48px 0 28px; text-align: center;
    font-size: 12.5px; color: var(--page-muted); opacity: .8;
  }
  .docs-footer a { color: var(--page-muted); }

  /* 移动端：侧栏变成顶部横向 chips */
  @media (max-width: 880px) {
    .docs-wrap { display: block; padding-top: 76px; }
    .docs-side {
      position: sticky; top: 62px; z-index: 5; max-height: none; overflow: visible;
      margin: 0 -24px 20px; padding: 8px 24px;
      background: color-mix(in srgb, var(--page-bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }
    .docs-side .scroll-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .docs-side .scroll-row::-webkit-scrollbar { height: 0; }
    .side-group { margin: 0; display: contents; }
    .side-group-label { display: none; }
    .side-item {
      flex: none; padding: 5px 14px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--card); font-size: 13px;
    }
    .side-item.active { border-color: rgba(59, 130, 246, 0.6); box-shadow: none; }
    .corner-nav .corner-link span { display: none; }
    .corner-nav .gitee-corner span { display: none; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="radial"></div>
  <div class="grid"></div>
  <div class="glow-top"></div>
</div>

<div class="brand"><span class="diamond">◆</span><a class="title" href="index.html" style="text-decoration:none">句芒智元</a></div>

<div class="corner-nav">
  <a class="corner-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    <span>返回首页</span>
  </a>
  <a class="corner-link gitee-corner" href="https://gitee.com/nicky-chin/gromang" target="_blank" rel="noopener" aria-label="Gitee 源码仓库" title="Gitee 源码仓库">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="11.4" fill="#C71D23"/>
      <path d="M16.6 8.9A5.7 5.7 0 1 0 17.7 13.4H12.1" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
    </svg>
    <span>Gitee 仓库</span>
  </a>
</div>

<main class="docs-wrap">
  <aside class="docs-side" id="docs-side">
    <input class="side-filter" id="side-filter" type="search" placeholder="过滤文档…" aria-label="过滤文档">
    <div class="scroll-row" id="side-list"></div>
  </aside>
  <article class="docs-content">
    <div id="doc-content" class="md-body"><div class="doc-loading">正在加载文档…</div></div>
    <noscript><div class="doc-error">本文档中心需要启用 JavaScript 才能渲染。原始 Markdown 可在 <a href="https://gitee.com/nicky-chin/gromang/tree/main/docs" target="_blank" rel="noopener">Gitee 仓库</a>查看。</div></noscript>
    <div class="docs-footer">© 句芒智元 · <a href="index.html">返回首页</a> · 文档随版本演进，以应用内实际行为为准</div>
  </article>
</main>

<script type="module">
import { renderMarkdown } from './docs/render.js?v=2';

/* 文档注册表：id = docs/ 目录下的文件名（不含 .md）。分组与侧栏一致。 */
const DOCS = [
  { group: '开始', items: [
    { id: 'index', title: '文档索引' },
    { id: 'getting-started', title: '快速入门' },
    { id: 'product-overview', title: '产品全景' },
  ]},
  { group: '看护与值守', items: [
    { id: 'sentinel', title: '智能哨兵' },
    { id: 'pet', title: '桌面伴侣' },
  ]},
  { group: '会话与任务', items: [
    { id: 'sessions', title: '会话中心' },
    { id: 'assistants', title: '智能助手' },
    { id: 'cron-tasks', title: '计划任务' },
  ]},
  { group: '经验沉淀', items: [
    { id: 'memory', title: '记忆沉淀' },
    { id: 'skills', title: '技能沉淀' },
  ]},
  { group: '测试', items: [
    { id: 'page-testing', title: '智能化测试' },
  ]},
  { group: '知识与信息', items: [
    { id: 'knowledge', title: '知识图谱' },
    { id: 'trends', title: '趋势热榜' },
    { id: 'email', title: '智能邮箱' },
  ]},
  { group: '连接与配置', items: [
    { id: 'channels', title: '通信渠道' },
    { id: 'remote-access', title: '网关互联' },
    { id: 'providers', title: '模型路由' },
    { id: 'mcp', title: '工具中心' },
  ]},
  { group: '其他', items: [
    { id: 'music', title: '动感地带' },
  ]},
];

const MAP = {};
DOCS.forEach(g => g.items.forEach(d => { d.group = g.group; MAP[d.id] = d; }));
const docIds = new Set(Object.keys(MAP));

const contentEl = document.getElementById('doc-content');
const listEl = document.getElementById('side-list');
const filterEl = document.getElementById('side-filter');
const cache = new Map();
let currentId = null;
let pendingAnchor = null;

/* ---------- 侧栏 ---------- */
function buildSidebar() {
  const q = (filterEl.value || '').trim().toLowerCase();
  listEl.innerHTML = '';
  let any = false;
  for (const g of DOCS) {
    const hits = g.items.filter(d => !q || d.title.toLowerCase().includes(q) || d.id.includes(q));
    if (!hits.length) continue;
    const label = document.createElement('div');
    label.className = 'side-group-label';
    label.textContent = g.group;
    const wrap = document.createElement('div');
    wrap.className = 'side-group';
    wrap.appendChild(label);
    for (const d of hits) {
      any = true;
      const a = document.createElement('a');
      a.className = 'side-item' + (d.id === currentId ? ' active' : '');
      a.href = '#' + d.id;
      a.textContent = d.title;
      wrap.appendChild(a);
    }
    listEl.appendChild(wrap);
  }
  if (!any) {
    const e = document.createElement('div');
    e.className = 'side-empty';
    e.textContent = '没有匹配的文档';
    listEl.appendChild(e);
  }
}
filterEl.addEventListener('input', buildSidebar);

/* ---------- 文档加载 ---------- */
async function loadDoc(id) {
  currentId = id;
  buildSidebar();
  document.title = '句芒智元 · ' + MAP[id].title + ' — 使用者文档';
  contentEl.innerHTML = '<div class="doc-loading">正在加载文档…</div>';
  try {
    let md = cache.get(id);
    if (md === undefined) {
      const res = await fetch('docs/' + encodeURIComponent(id) + '.md');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      md = await res.text();
      cache.set(id, md);
    }
    const html = renderMarkdown(md, { docIds: Array.from(docIds) });
    contentEl.innerHTML = html;
    if (pendingAnchor) {
      const a = pendingAnchor; pendingAnchor = null;
      scrollToAnchor(a);
    } else {
      window.scrollTo(0, 0);
    }
  } catch (e) {
    contentEl.innerHTML =
      '<div class="doc-error">该文档暂时无法加载（可能尚未发布）。<br>' +
      '可返回 <a href="#index">文档索引</a> 查看已上线的文档，或到 ' +
      '<a href="https://gitee.com/nicky-chin/gromang/tree/main/docs" target="_blank" rel="noopener">Gitee 仓库</a> 阅读。</div>';
  }
}

function scrollToAnchor(anchor) {
  const el = document.getElementById(anchor);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 路由 ---------- */
function route() {
  const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (h.startsWith('d-')) {
    if (currentId === null) { pendingAnchor = h; loadDoc('index'); }
    else scrollToAnchor(h);
    return;
  }
  const id = MAP[h] ? h : 'index';
  if (id !== currentId) loadDoc(id);
}

window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
